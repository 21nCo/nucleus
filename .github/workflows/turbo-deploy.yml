name: Turbo Deploy

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to deploy'
        required: true
        default: 'nucleus'
        type: choice
        options:
          - nucleus
          - memotron
          - pointron
          - all
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - pre
          - live
  push:
    branches:
      - dev
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**'
      - 'packages/**'
      - 'shared/**'
      - 'deployment/**'

env:
  NODE_OPTIONS: --max_old_space_size=4096
  AWS_DEFAULT_REGION: us-east-1

jobs:
  detect-config:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
      environment: ${{ steps.detect.outputs.environment }}
      deploy-type: ${{ steps.detect.outputs.deploy-type }}
    steps:
      - name: Detect deployment configuration
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger
            if [ "${{ github.event.inputs.project }}" = "all" ]; then
              echo "projects=[\"nucleus\", \"memotron\", \"pointron\"]" >> $GITHUB_OUTPUT
            else
              echo "projects=[\"${{ github.event.inputs.project }}\"]" >> $GITHUB_OUTPUT
            fi
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "deploy-type=manual" >> $GITHUB_OUTPUT
          else
            # Auto-deploy all projects to dev on dev branch push
            echo "projects=[\"nucleus\", \"memotron\", \"pointron\"]" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "deploy-type=auto" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: detect-config
    if: needs.detect-config.outputs.deploy-type == 'auto' || (needs.detect-config.outputs.deploy-type == 'manual' && contains(fromJson('["dev", "pre", "live"]'), needs.detect-config.outputs.environment))
    environment: ${{ needs.detect-config.outputs.environment }}
    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-config.outputs.projects) }}
      fail-fast: false
    defaults:
      run:
        working-directory: ./apps/${{ matrix.project }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if project exists
        run: |
          if [ ! -d "." ]; then
            echo "❌ Project ${{ matrix.project }} does not exist"
            exit 1
          fi
          echo "✅ Project ${{ matrix.project }} found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/${{ matrix.project }}/package-lock.json

      - name: Install dependencies (workspace)
        run: |
          cd ../../
          npm ci --legacy-peer-deps

      - name: Set dynamic secret names
        run: |
          PROJECT_UPPER=$(echo "${{ matrix.project }}" | tr '[:lower:]' '[:upper:]')
          echo "APP_ENV_VARS_SECRET=${PROJECT_UPPER}_APP_ENV_VARS" >> $GITHUB_ENV

      - name: Create environment file with fallback
        run: |
          # Check if project-specific env vars exist, fallback to default
          PROJECT_ENV_VARS="${{ vars[env.APP_ENV_VARS_SECRET] }}"
          DEFAULT_ENV_VARS="${{ vars.DEFAULT_APP_ENV_VARS }}"
          
          if [ -n "$PROJECT_ENV_VARS" ]; then
            echo "$PROJECT_ENV_VARS" > .env
            echo "✅ Using ${{ matrix.project }}-specific environment variables"
          elif [ -n "$DEFAULT_ENV_VARS" ]; then
            echo "$DEFAULT_ENV_VARS" > .env
            echo "⚠️ Using default environment variables for ${{ matrix.project }}"
          else
            echo "❌ No environment variables found for ${{ matrix.project }}"
            exit 1
          fi

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.project }}-${{ needs.detect-config.outputs.environment }}
          path: apps/${{ matrix.project }}/build/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-config, build]
    if: always() && needs.build.result == 'success'
    environment: ${{ needs.detect-config.outputs.environment }}
    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-config.outputs.projects) }}
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            deployment/package-lock.json
            deployment/cdk/client/package-lock.json

      - name: Set dynamic secret names
        run: |
          PROJECT_UPPER=$(echo "${{ matrix.project }}" | tr '[:lower:]' '[:upper:]')
          echo "AWS_ACCESS_KEY_SECRET=${PROJECT_UPPER}_AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_KEY_SECRET=${PROJECT_UPPER}_AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "CDK_ENV_VARS_SECRET=${PROJECT_UPPER}_CDK_ENV_VARS" >> $GITHUB_ENV

      - name: Configure AWS credentials with fallback
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838  # v5.0.0
        with:
          aws-access-key-id: ${{ secrets[env.AWS_ACCESS_KEY_SECRET] || secrets.DEFAULT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets[env.AWS_SECRET_KEY_SECRET] || secrets.DEFAULT_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.project }}-${{ needs.detect-config.outputs.environment }}
          path: apps/${{ matrix.project }}/build/

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install deployment dependencies
        working-directory: ./deployment
        run: |
          npm ci --legacy-peer-deps

      - name: Build CDK client
        working-directory: ./deployment/cdk/client
        run: ../../node_modules/.bin/tsc -p tsconfig.json

      - name: Set CDK environment variables with fallback
        run: |
          PROJECT_CDK_ENV_VARS="${{ vars[env.CDK_ENV_VARS_SECRET] }}"
          DEFAULT_CDK_ENV_VARS="${{ vars.DEFAULT_CDK_ENV_VARS }}"
          
          if [ -n "$PROJECT_CDK_ENV_VARS" ]; then
            echo "$PROJECT_CDK_ENV_VARS" >> $GITHUB_ENV
            echo "✅ Using ${{ matrix.project }}-specific CDK environment variables"
          elif [ -n "$DEFAULT_CDK_ENV_VARS" ]; then
            echo "$DEFAULT_CDK_ENV_VARS" >> $GITHUB_ENV
            echo "⚠️ Using default CDK environment variables for ${{ matrix.project }}"
          else
            echo "❌ No CDK environment variables found, using defaults"
            echo "domain=tidigit.dev" >> $GITHUB_ENV
            echo "isUseParentZone=true" >> $GITHUB_ENV
          fi

      - name: Verify AWS configuration
        run: |
          echo "🔍 AWS Configuration:"
          aws configure list
          aws sts get-caller-identity

      - name: Deploy with CDK
        working-directory: ./deployment/cdk/client
        run: ../../node_modules/.bin/cdk deploy --all --require-approval never
        env:
          PROJECT_NAME: ${{ matrix.project }}
          ENVIRONMENT: ${{ needs.detect-config.outputs.environment }}
          domain: ${{ env.domain }}
          subdomain: ${{ env.subdomain }}
          isUseParentZone: ${{ env.isUseParentZone }}

      - name: Deploy status
        run: |
          echo "✅ Successfully deployed ${{ matrix.project }} to ${{ needs.detect-config.outputs.environment }}"
